:root{--bg:#F1F2F0;--surface:#FFFFFF;--sunk:#E6E8E5;--ink:#1A1C1E;--muted:#5D6369;--line:#D1D5D2;--wood:#8C3A28;--ok:#1E7A4C;--ok-soft:#DCF1E5;--bad:#B42335;--bad-soft:#F8DDE1;

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}

button.primary{background:var(--wood);border-color:var(--wood);color:#fff}button.small{min-height:36px;padding:4px 10px;font-size:.9rem}button:disabled{opacity:.5}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
label{display:grid;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
.it{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}.it span.t{flex:1;min-width:0}
.bar{flex:1;height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;min-width:120px}.bar i{display:block;height:100%;background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:9}
.sheet{background:var(--surface);border-radius:18px;padding:22px;width:min(560px,100%);text-align:center;display:grid;gap:12px}
.tele{font-family:var(--f-display);font-size:2rem;line-height:1.2;margin:10px 0}
.msg{border-radius:12px;padding:10px 14px;font-weight:700}.msg.ok{background:var(--ok-soft);color:var(--ok)}.msg.bad{background:var(--bad-soft);color:var(--bad)}
</style>
