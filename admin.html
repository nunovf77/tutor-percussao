<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="copyright" content="© 2026 Nuno Freitas. Todos os direitos reservados.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Consola do Pai</title>
<style>
:root{--bg:#F6F4EF;--surface:#FFFFFF;--sunk:#EDEAE3;--ink:#1F2326;--muted:#5D6369;--line:#DAD5CB;--brass:#8A6414;--brass-soft:#F4EAD2;--ok:#1C7A4A;--ok-soft:#DDF1E6;--warn:#9A5B00;--warn-soft:#FBEBD2;--bad:#B3261E;--bad-soft:#FBE1DE;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121416;--surface:#1B1E21;--sunk:#25292D;--ink:#ECEEEF;--muted:#A3A9AF;--line:#343A3F;--brass:#E3BA5C;--brass-soft:#352C18;--ok:#5CCB8F;--ok-soft:#163326;--warn:#F1AB4B;--warn-soft:#3A2A13;--bad:#F37481;--bad-soft:#3D1C22;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:1.35rem;margin:0}h1 small{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
h2{font-size:1.05rem;margin:0 0 8px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.danger{background:var(--bad);color:#fff;border-color:var(--bad)}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.small{padding:4px 10px;font-size:.85rem}
input,select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi b{display:block;font-size:1.5rem}.kpi span{color:var(--muted);font-size:.85rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--sunk)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem;background:var(--surface)}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{background:var(--sunk);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.wrapc{white-space:normal;min-width:180px}
.banner{border-radius:14px;padding:14px 16px;margin-bottom:12px;font-weight:600}
.banner.bad{background:var(--bad-soft);color:var(--bad);border:2px solid var(--bad)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;max-width:90vw}
code{background:var(--sunk);padding:1px 6px;border-radius:6px;word-break:break-all}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Consola do Pai<small>Tutor de Percussão e FM · aparelhos, movimentação e segurança</small></h1><div class="row"><span class="muted small" id="upd"></span><button id="bR" type="button">Atualizar</button><button id="bO" type="button">Sair</button></div></header>
<main id="main"></main>
</div>
<script>
"use strict";
/* Consola do pai: só funciona com o código de ADMINISTRAÇÃO (enviado por email ao dono da conta Google pelo servidor 3.18).
   O código fica guardado apenas neste browser. Nada aqui apaga dados: bloquear só recusa pedidos; a app guarda tudo e envia depois. */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const main=$("#main");const A={url:"",key:"",tab:"estado",st:null,filtro:""};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function creds(){const h=new URLSearchParams(location.hash.slice(1));if(h.get("u")&&h.get("k")){A.url=h.get("u");A.key=h.get("k");try{localStorage.setItem("tpa-adm",JSON.stringify({u:A.url,k:A.key}))}catch(e){}history.replaceState(null,"",location.pathname)}
  else{try{const c=JSON.parse(localStorage.getItem("tpa-adm")||"null");if(c){A.url=c.u;A.key=c.k}}catch(e){}}}
async function api(body){const r=await fetch(A.url,{method:"POST",body:JSON.stringify({...body,token:A.key,dev:"admin",ua:navigator.userAgent.slice(0,120)})});const j=await r.json();if(!j.ok)throw new Error(j.err||"erro");return j}
const dt=ts=>ts?new Date(ts).toLocaleString("pt-PT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"—";
const ago=ts=>{if(!ts)return "—";const m=Math.round((Date.now()-ts)/60000);return m<1?"agora":m<60?m+" min":m<1440?Math.round(m/60)+" h":Math.round(m/1440)+" d"};
const navTxt=u=>{u=String(u||"");const os=/Android/.test(u)?"Android":/iPad|iPhone/.test(u)?"iPad/iPhone":/Windows/.test(u)?"Windows":/Mac OS/.test(u)?"Mac":/Linux/.test(u)?"Linux":"?";const br=/Edg\//.test(u)?"Edge":/Chrome\//.test(u)?"Chrome":/Firefox\//.test(u)?"Firefox":/Safari\//.test(u)?"Safari":"";return u?os+(br?" · "+br:""):"—"};
function login(msg){main.innerHTML=`<div class="card" style="max-width:560px;margin:30px auto"><h2>Entrar</h2><p class="muted">Usa o link que recebeste por email («Consola de administração — código do pai»), ou escreve o endereço do servidor e o código de administração.</p>
  <div class="row" style="flex-direction:column;align-items:stretch"><input id="lu" placeholder="https://script.google.com/macros/s/…/exec"><input id="lk" type="password" placeholder="Código de administração" autocomplete="off"><button id="lg" type="button" class="ok">Entrar</button></div><p class="small" id="lm" style="color:var(--bad)">${esc(msg||"")}</p></div>`;
  $("#lg").onclick=()=>{A.url=$("#lu").value.trim();A.key=$("#lk").value.trim();try{localStorage.setItem("tpa-adm",JSON.stringify({u:A.url,k:A.key}))}catch(e){}load()}}
async function load(){if(!A.url||!A.key){login();return}if(!A.st)main.innerHTML='<p class="muted">A carregar…</p>';
  try{A.st=await api({type:"adm_state"});$("#upd").textContent="atualizado "+new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});render()}
  catch(e){if(e.message==="token")login("Código de administração não aceite (o servidor tem de estar na versão 3.18 e o código tem de ser o do email).");else if(!A.st)login(/Failed to fetch|NetworkError|Load failed/i.test(e.message)?"O servidor deu erro (normalmente faltam as autorizações novas da 3.18). No editor do Apps Script escolhe a função «autorizar», carrega em ▶ Executar e aceita; depois volta a entrar aqui.":"Não consegui ligar ao servidor: "+e.message)}}
function render(){const S=A.st;const pend=S.devices.filter(d=>d[2]==="pendente").length;const sec24=S.seguranca.filter(r=>Date.now()-r[0]<864e5&&!/^pai:/.test(r[1])).length;
  main.innerHTML=`${S.lock?`<div class="banner bad">🔒 BLOQUEIO GERAL ATIVO — o servidor recusa todos os pedidos da app e do portal. Nada se perde: fica tudo guardado nos aparelhos e segue quando desbloqueares. <button type="button" class="ok small" id="unl" style="margin-left:8px">Desbloquear</button></div>`:""}
   ${pend?`<div class="banner" style="background:var(--warn-soft);color:var(--warn)">⚠️ ${pend} aparelho(s) à espera de autorização — vê em «Aparelhos».</div>`:""}
   <nav>${[["estado","Estado"],["aparelhos",`Aparelhos (${S.devices.length})`],["mov","Movimentação"],["seg",`Segurança${sec24?" ("+sec24+")":""}`],["codigos","Códigos"]].map(([k,n])=>`<button type="button" data-t="${k}" aria-pressed="${A.tab===k||(A.tab==="user"&&k==="aparelhos")}">${n}</button>`).join("")}</nav><div id="v"></div>`;
  $$("nav button").forEach(b=>b.onclick=()=>{A.tab=b.dataset.t;render()});if($("#unl"))$("#unl").onclick=()=>lock(false);
  ({estado:vEstado,aparelhos:vAparelhos,mov:vMov,seg:vSeg,codigos:vCodigos,user:vUser})[A.tab]()}
function vEstado(){const S=A.st;const aut=S.devices.filter(d=>d[2]==="autorizado").length;const graceOn=S.grace&&Date.now()<S.grace;
  $("#v").innerHTML=`<div class="grid">
   <div class="card kpi"><span>Servidor</span><b>${esc(S.v)}</b><span class="chip ${S.lock?"bad":"ok"}">${S.lock?"bloqueado":"a funcionar"}</span></div>
   <div class="card kpi"><span>Aparelhos autorizados</span><b>${aut} / ${S.devices.length}</b><span>${graceOn?"aceitação automática até "+dt(S.grace):"novos aparelhos ficam à espera"}</span></div>
   <div class="card kpi"><span>Sessões recebidas</span><b>${S.sessoes}</b><span>entregas: ${S.entregas} · por corrigir: ${S.porCorrigir}</span></div>
   <div class="card kpi"><span>Emails disponíveis hoje</span><b>${S.mailQuota}</b><span>códigos errados (15 min): ${S.fails15}</span></div></div>
   <div class="card"><h2>Bloqueio geral</h2><p class="muted small">Em caso de dúvida (aparelho estranho, código partilhado, tentativas de entrada), bloqueia tudo. A app da Inês e o portal do professor deixam de chegar ao servidor, mas não se perde nada: a app guarda relatórios, gravações e entregas e envia quando desbloqueares. O bloqueio liga-se sozinho com 10 códigos errados em 15 minutos.</p>
    ${S.lock?`<button type="button" class="ok" id="lk0">🔓 Desbloquear</button>`:`<button type="button" class="danger" id="lk1">🔒 Bloquear tudo agora</button>`}</div>
   <div class="card"><h2>Servidor e dados</h2><div class="tw"><table><tbody>
    <tr><th>Conta (dono)</th><td>${esc(S.dono)}</td></tr><tr><th>Endereço do servidor</th><td class="wrapc"><code>${esc(S.url)}</code></td></tr>
    <tr><th>Folha de registo</th><td><a href="${esc(S.sheet)}" target="_blank" rel="noopener">abrir no Drive</a></td></tr><tr><th>Pasta no Drive</th><td><a href="${esc(S.pasta)}" target="_blank" rel="noopener">Tutor de Percussão</a></td></tr>
    <tr><th>Conversor de partituras</th><td>${S.conv?esc((S.conv.gasto!=null?S.conv.gasto+" € gastos":"")+(S.conv.limite!=null?" de "+S.conv.limite+" €/mês":"")):"—"}</td></tr>
    <tr><th>App da aluna</th><td><a href="https://nunovf77.github.io/tutor-percussao/" target="_blank" rel="noopener">nunovf77.github.io/tutor-percussao</a> <span class="muted small">(sem código não dá acesso a dados)</span></td></tr></tbody></table></div>
    <p class="muted small" style="margin:8px 0 0">O IP é o que o próprio aparelho indica (o Google não mostra ao servidor o IP de quem liga): serve para reconhecer, não é prova.</p></div>`;
  const b1=$("#lk1"),b0=$("#lk0");if(b1)b1.onclick=()=>lock(true);if(b0)b0.onclick=()=>lock(false)}
async function lock(on){if(on&&!confirmar("lk1","Confirmar: bloquear tudo"))return;try{await api({type:"adm_lock",on:!!on});toast(on?"Bloqueio geral ligado.":"Desbloqueado.");A.st=null;load()}catch(e){toast("Falhou: "+e.message)}}
function confirmar(id,txt){const b=document.getElementById(id);if(!b)return true;if(b.dataset.c==="1")return true;b.dataset.c="1";b.textContent=txt;setTimeout(()=>{if(b.isConnected){b.dataset.c="";render()}},6000);return false}
function vAparelhos(){const S=A.st;const cls={autorizado:"ok",pendente:"warn",bloqueado:"bad"};
  $("#v").innerHTML=`<div class="card"><h2>Aparelhos</h2><p class="muted small">Cada aparelho que usou a app da aluna ou o portal do professor. Só os «autorizados» chegam aos dados. Dá um nome para os reconheceres (ex.: «Tablet da Inês», «PC do professor»). A mudança vale no máximo 1 minuto depois.</p>
   <div class="tw"><table><thead><tr><th>Nome</th><th>Papel</th><th>Estado</th><th>Último acesso</th><th>Pedidos</th><th>Aparelho</th><th>IP</th><th>Primeiro acesso</th><th>Atividade</th><th>Identificação</th></tr></thead><tbody>
   ${S.devices.sort((a,b)=>(b[5]||0)-(a[5]||0)).map((d,i)=>`<tr><td><input data-n="${esc(d[0])}" value="${esc(d[3]||"")}" placeholder="dar nome…" style="width:150px"></td><td>${d[1]==="professor"?"Portal do professor":"App da aluna"}</td>
     <td><select data-e="${esc(d[0])}">${["autorizado","pendente","bloqueado"].map(o=>`<option ${d[2]===o?"selected":""}>${o}</option>`).join("")}</select> <span class="chip ${cls[d[2]]||""}">${esc(d[2])}</span></td>
     <td>${esc(dt(d[5]))} <span class="muted small">(${ago(d[5])})</span></td><td>${esc(d[6])}</td><td>${esc(navTxt(d[7]))}</td><td>${esc(d[8]||"—")}</td><td>${esc(dt(d[4]))}</td><td><button type="button" class="small" data-u="${esc(d[0])}">Ver atividade</button></td><td class="muted small">${esc(d[0])}</td></tr>`).join("")||`<tr><td colspan="10" class="muted">Ainda nenhum aparelho registado (o registo começa com o servidor 3.17).</td></tr>`}</tbody></table></div></div>`;
  $$("[data-e]").forEach(s=>s.onchange=async()=>{try{await api({type:"adm_dev",id:s.dataset.e,estado:s.value});toast("Estado: "+s.value);A.st=null;load()}catch(e){toast("Falhou: "+e.message)}});
  $$("[data-u]").forEach(b=>b.onclick=()=>{A.user=b.dataset.u;A.tab="user";render()});
  $$("[data-n]").forEach(inp=>inp.onchange=async()=>{try{await api({type:"adm_dev",id:inp.dataset.n,nome:inp.value.trim()});toast("Nome guardado.")}catch(e){toast("Falhou: "+e.message)}})}
/* atividade de um utilizador (aparelho): o que anda a fazer na plataforma */
async function vUser(){const S=A.st;const d=S.devices.find(x=>x[0]===A.user);const nome=d&&d[3]||A.user;const v=$("#v");v.innerHTML=`<div class="card"><button type="button" class="small" id="uBack">← Aparelhos</button> <b style="margin-left:8px">${esc(nome)}</b> <span class="muted small">${esc(A.user)}</span><p class="muted">A carregar a atividade…</p></div>`;$("#uBack").onclick=()=>{A.tab="aparelhos";render()};
  let U;try{U=await api({type:"adm_user",id:A.user})}catch(e){v.innerHTML+=`<div class="card"><p>${e.message==="type"?"Atualiza o servidor para a versão 3.18 mais recente (atividade por utilizador).":"Falhou: "+esc(e.message)}</p></div>`;return}
  const TIP={report:"relatório de sessão",pull:"sincronização",ping:"teste de ligação",entrega:"entrega ao professor",score:"partitura enviada",backup:"cópia do progresso",restore:"recuperar progresso",t_list:"abriu as sessões",t_entregas:"abriu as entregas",t_corrigir:"corrigiu uma entrega",t_trabalho:"enviou TPC",t_grade:"deu nota a um exercício",t_audio:"ouviu uma gravação",t_programa:"programa da prova",t_pieces:"peças",repo_put:"enviou PDF",repo_get:"descarregou PDF",voz_put:"voz do pai"};
  const cont={};U.acessos.forEach(a=>{cont[a[1]]=(cont[a[1]]||0)+1});const ult=U.acessos[0];
  const resumo=Object.entries(cont).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span class="chip" style="margin:2px">${esc(TIP[k]||k)}: ${n}</span>`).join(" ");
  let h=`<div class="card"><button type="button" class="small" id="uBack">← Aparelhos</button> <b style="margin-left:8px">${esc(nome)}</b> <span class="muted small">${esc(A.user)} · ${U.papel==="professor"?"Portal do professor":"App da aluna"}</span>
    <div class="grid" style="margin-top:10px"><div class="kpi"><span>Último movimento</span><b>${ult?esc(ago(ult[0])):"—"}</b><span>${ult?esc(TIP[ult[1]]||ult[1]):""}</span></div><div class="kpi"><span>Pedidos registados</span><b>${U.acessos.length}</b><span>últimos 300</span></div>
    ${U.papel==="tablet"?`<div class="kpi"><span>Sessões deste aparelho</span><b>${(U.sessoes||[]).length}</b><span>${(U.sessoes||[]).reduce((t,x)=>t+(+x.min||0),0)} min no total</span></div>`:`<div class="kpi"><span>Correções feitas</span><b>${(U.correcoes||[]).length}</b><span>notas a exercícios: ${(U.notas||[]).length}</span></div>`}</div>
    <p class="small" style="margin:8px 0 0">${resumo||'<span class="muted">Sem movimentos registados.</span>'}</p></div>`;
  if(U.papel==="tablet"){h+=`<div class="card"><h2>Sessões de estudo (deste aparelho)</h2><div class="tw"><table><thead><tr><th>Início</th><th>Min</th><th>Exercícios</th><th>Média</th><th>O que fez</th></tr></thead><tbody>${(U.sessoes||[]).map(x=>`<tr><td>${esc(dt(x.inicio))}</td><td>${esc(x.min)}</td><td>${esc(x.n)}</td><td>${esc(x.media)}</td><td class="wrapc">${x.itens.slice(0,8).map(i=>esc(i[1])+(i[2]!==""?` <span class="muted">(${esc(i[2])})</span>`:"")).join(" · ")}${x.itens.length>8?` <span class="muted">+${x.itens.length-8}</span>`:""}${x.nota?`<br><span class="muted">nota da aluna: ${esc(x.nota)}</span>`:""}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">Sem sessões com a identificação deste aparelho (as antigas, antes da 1.47, não a tinham).</td></tr>`}</tbody></table></div></div>
    <div class="card"><h2>Entregas ao professor (da Inês)</h2><div class="tw"><table><thead><tr><th>Entregue</th><th>Tarefa</th><th>App</th><th>Estado</th><th>Nota</th></tr></thead><tbody>${(U.entregas||[]).map(e=>`<tr><td>${esc(dt(e.recebido))}</td><td class="wrapc">${esc(e.titulo)}</td><td>${esc(e.app)}</td><td>${esc(e.estado)}</td><td>${esc(e.nota)}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">Sem entregas.</td></tr>`}</tbody></table></div></div>`}
  else{h+=`<div class="card"><h2>TPC enviado</h2>${U.trabalho?`<p>Para a aula de <b>${esc(U.trabalho.aula)}</b> (enviado ${esc(dt(U.trabalho.criado))}): ${U.trabalho.tarefas.map(esc).join(" · ")}</p>`:'<p class="muted">Ainda não enviou TPC pelo portal.</p>'}</div>
    <div class="card"><h2>Correções de entregas</h2><div class="tw"><table><thead><tr><th>Quando</th><th>Entrega</th><th>Resultado</th><th>Nota</th><th>Comentário</th></tr></thead><tbody>${(U.correcoes||[]).map(e=>`<tr><td>${esc(dt(e.corrigido))}</td><td class="wrapc">${esc(e.titulo)}</td><td>${esc(e.estado)}</td><td>${esc(e.nota)}</td><td class="wrapc">${esc(e.com)}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">Ainda sem correções.</td></tr>`}</tbody></table></div></div>
    <div class="card"><h2>Notas e comentários a exercícios</h2><div class="tw"><table><thead><tr><th>Quando</th><th>Exercício</th><th>Nota</th><th>Comentário</th></tr></thead><tbody>${(U.notas||[]).map(r=>`<tr><td>${esc(dt(r[0]))}</td><td class="wrapc">${esc(r[1])}</td><td>${esc(r[2])}</td><td class="wrapc">${esc(r[3])}</td></tr>`).join("")||`<tr><td colspan="4" class="muted">Sem notas.</td></tr>`}</tbody></table></div><p class="muted small" style="margin:6px 0 0">Correções e notas são do portal do professor (todos os aparelhos dele).</p></div>`}
  h+=`<div class="card"><h2>Movimentos deste aparelho</h2><div class="tw"><table><thead><tr><th>Data</th><th>O que fez</th><th>Resultado</th></tr></thead><tbody>${U.acessos.map(a=>`<tr><td>${esc(dt(a[0]))}</td><td>${esc(TIP[a[1]]||a[1])}</td><td><span class="chip ${a[2]==="ok"?"ok":"bad"}">${esc(a[2])}</span></td></tr>`).join("")||`<tr><td colspan="3" class="muted">Sem movimentos.</td></tr>`}</tbody></table></div></div>`;
  v.innerHTML=h;$("#uBack").onclick=()=>{A.tab="aparelhos";render()}}
function vMov(){const S=A.st;const nomes=Object.fromEntries(S.devices.map(d=>[d[0],d[3]||""]));const f=A.filtro.toLowerCase();const L=S.acessos.filter(r=>!f||r.join(" ").toLowerCase().includes(f)||String(nomes[r[1]]||"").toLowerCase().includes(f));
  const TIP={report:"relatório de sessão",pull:"sincronização",ping:"teste de ligação",entrega:"entrega ao professor",score:"partitura enviada",backup:"cópia do progresso",restore:"recuperar progresso",t_list:"professor: sessões",t_entregas:"professor: entregas",t_corrigir:"professor: correção",t_trabalho:"professor: TPC",t_grade:"professor: nota",t_audio:"professor: ouvir gravação",repo_put:"repositório: enviar PDF",repo_get:"repositório: descarregar",voz_put:"voz do pai"};
  $("#v").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Movimentação</h2><input id="flt" placeholder="filtrar (nome, pedido, professor…)" value="${esc(A.filtro)}" style="width:260px"></div>
   <p class="muted small">Últimos ${S.acessos.length} pedidos ao servidor (sincronizações e testes contam no máximo 1 vez por 10 min por aparelho).</p>
   <div class="tw"><table><thead><tr><th>Data</th><th>Quem</th><th>Papel</th><th>Pedido</th><th>Resultado</th></tr></thead><tbody>
   ${L.slice(0,300).map(r=>`<tr><td>${esc(dt(r[0]))}</td><td><a href="#" data-u2="${esc(r[1])}">${esc(nomes[r[1]]||r[1])}</a></td><td>${esc(r[2])}</td><td>${esc(TIP[r[3]]||r[3])}</td><td><span class="chip ${r[4]==="ok"?"ok":"bad"}">${esc(r[4]||"")}</span></td></tr>`).join("")||`<tr><td colspan="5" class="muted">Sem movimentos.</td></tr>`}</tbody></table></div></div>`;
  $$("[data-u2]").forEach(a=>a.onclick=e=>{e.preventDefault();A.user=a.dataset.u2;A.tab="user";render()});
  const fl=$("#flt");fl.oninput=()=>{A.filtro=fl.value;const p=fl.selectionStart;vMov();const n=$("#flt");n.focus();n.setSelectionRange(p,p)}}
function vSeg(){const S=A.st;const grave=r=>/BLOQUEIO|errado|insiste/.test(r[1]);
  $("#v").innerHTML=`<div class="card"><h2>Segurança</h2><p class="muted small">Códigos errados, aparelhos não autorizados a insistir, bloqueios e as tuas ações. 10 códigos errados em 15 minutos ligam o bloqueio geral sozinho e recebes um email.</p>
   <div class="tw"><table><thead><tr><th>Data</th><th>Evento</th><th>Papel</th><th>Aparelho</th><th>IP</th><th>Navegador</th><th>Pedido</th></tr></thead><tbody>
   ${S.seguranca.map(r=>`<tr><td>${esc(dt(r[0]))}</td><td class="wrapc">${grave(r)?`<span class="chip bad">!</span> `:""}${esc(r[1])}</td><td>${esc(r[2])}</td><td class="muted small">${esc(r[3]||"—")}</td><td>${esc(r[4]||"—")}</td><td>${esc(navTxt(r[5]))}</td><td>${esc(r[6]||"")}</td></tr>`).join("")||`<tr><td colspan="7" class="muted">Sem eventos de segurança. 👍</td></tr>`}</tbody></table></div></div>`}
function vCodigos(){$("#v").innerHTML=`<div class="card"><h2>Códigos</h2><p class="muted small">Troca um código se suspeitares que alguém o tem. O código antigo deixa de funcionar na hora; recebes o novo por email.</p>
   <div class="tw"><table><tbody>
   <tr><th>Tablet / PC da Inês</th><td class="wrapc">Depois de trocar: no tablet, Pais → Envio → colar o código novo (ou abrir o link que aparece aqui).</td><td><button type="button" class="danger small" id="r-tablet">Trocar</button></td></tr>
   <tr><th>Professor</th><td class="wrapc">Depois de trocar: envia ao professor o link novo que aparece aqui.</td><td><button type="button" class="danger small" id="r-professor">Trocar</button></td></tr>
   <tr><th>Administração (esta consola)</th><td class="wrapc">Depois de trocar: esta consola passa a usar o novo; guarda o email.</td><td><button type="button" class="danger small" id="r-admin">Trocar</button></td></tr></tbody></table></div><div id="rout" style="margin-top:10px"></div></div>`;
  ["tablet","professor","admin"].forEach(q=>$("#r-"+q).onclick=async()=>{if(!confirmar("r-"+q,"Confirmar troca"))return;try{const j=await api({type:"adm_rotate",qual:q});
    if(q==="admin"){A.key=j.code;try{localStorage.setItem("tpa-adm",JSON.stringify({u:A.url,k:A.key}))}catch(e){}}
    const link=q==="professor"?`https://nunovf77.github.io/tutor-percussao/professor.html#u=${encodeURIComponent(j.url)}&k=${j.code}`:q==="tablet"?`https://nunovf77.github.io/tutor-percussao/#u=${encodeURIComponent(j.url)}&k=${j.code}`:"";
    $("#rout").innerHTML=`<div class="banner ok">Código ${esc(q)} trocado. Novo código: <code>${esc(j.code)}</code>${link?`<br>Link: <code>${esc(link)}</code>`:""}</div>`}catch(e){toast("Falhou: "+e.message)}})}
$("#bR").onclick=()=>load();$("#bO").onclick=()=>{try{localStorage.removeItem("tpa-adm")}catch(e){}A.url=A.key="";A.st=null;login()};
creds();load();setInterval(()=>{if(A.key&&A.tab!=="user"&&document.visibilityState==="visible"&&!document.activeElement.matches("input,select"))load()},60000);
</script>
